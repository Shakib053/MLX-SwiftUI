<style>
#history-preview { padding: 18px 0; }
#history-preview [hidden] { display: none !important; }
#history-preview .phone {
  color-scheme: light dark;
  --page: light-dark(#f6f7fa, #151619);
  --surface: light-dark(#fff, #242529);
  --ink: light-dark(#191a20, #f3f3f6);
  --quiet: light-dark(#585e6a, #b5b9c2);
  --line: light-dark(#e0e2e9, #393b43);
  --accent: light-dark(#5146bd, #b6adff);
  --keyboard: light-dark(#dce0e8, #303138);
  width: min(100%, 370px); min-height: 520px; margin: auto; display: flex; flex-direction: column;
  background: var(--page); color: var(--ink); border: 1px solid var(--line); border-radius: 24px; overflow: hidden;
  font: 15px system-ui, sans-serif;
}
#history-preview header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; min-height: 68px; box-sizing: border-box; gap: 10px; }
#history-preview h2 { margin: 0; color: inherit; font: 600 19px system-ui; }
#history-preview button { font: inherit; color: var(--accent); border: 0; border-radius: 12px; background: var(--surface); min-height: 44px; padding: 0 12px; }
#history-preview button svg { vertical-align: middle; }
#history-preview form { display: flex; gap: 8px; width: 100%; }
#history-preview input { min-width: 0; flex: 1; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; color: var(--ink); background: var(--surface); font: 16px system-ui; }
#history-preview input::placeholder { color: var(--quiet); }
#history-preview main { flex: 1; padding: 10px 18px 16px; }
#history-preview small { color: var(--quiet); font-size: 12px; }
#history-preview ul { padding: 0; margin: 10px 0 0; list-style: none; background: var(--surface); border-radius: 14px; }
#history-preview li { padding: 12px 14px; }
#history-preview li + li { border-top: 1px solid var(--line); }
#history-preview li small { display: block; margin-top: 3px; }
#history-preview nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 9px 0 13px; }
#history-preview nav span { display: grid; gap: 3px; justify-items: center; color: var(--quiet); font-size: 11px; }
#history-preview nav [aria-current] { color: var(--accent); font-weight: 600; }
#history-preview .keyboard { padding: 8px 6px 12px; background: var(--keyboard); display: grid; gap: 5px; }
#history-preview .key-row { display: flex; justify-content: center; gap: 4px; }
#history-preview .key-row button { min-width: 0; flex: 0 1 9%; min-height: 32px; padding: 0; border-radius: 5px; color: var(--ink); }
#history-preview .key-row button[data-key=" "] { flex-basis: 48%; }
#history-preview .key-row button[data-key="Backspace"] { flex-basis: 22%; }
</style>
<div id="history-preview" class="viz-dotted-background">
  <section class="phone" aria-label="History search preview">
    <header>
      <h2>History</h2>
      <button type="button" class="cursor-interaction" data-open><i data-lucide="search" aria-hidden="true"></i> Search</button>
      <form role="search" hidden>
        <button type="button" class="cursor-interaction" data-back aria-label="Back to History"><i data-lucide="chevron-left" aria-hidden="true"></i> Back</button>
        <input type="search" placeholder="Search history" aria-label="Search history" autocomplete="off">
      </form>
    </header>
    <main>
      <small>Saved on this device</small>
      <ul aria-label="Sample history">
        <li>Summarize meeting notes<small>Today</small></li>
        <li>Draft a reply to Sam<small>Today</small></li>
        <li>Plan the weekend trip<small>Yesterday</small></li>
        <li>SwiftUI animation ideas<small>Yesterday</small></li>
      </ul>
      <p role="status" hidden>No matching history</p>
      <span class="sr-only" aria-live="polite" data-count></span>
    </main>
    <nav aria-label="App tabs">
      <span><i data-lucide="house" aria-hidden="true"></i>Home</span>
      <span><i data-lucide="cpu" aria-hidden="true"></i>Models</span>
      <span aria-current="page"><i data-lucide="history" aria-hidden="true"></i>History</span>
      <span><i data-lucide="settings" aria-hidden="true"></i>Settings</span>
    </nav>
    <div class="keyboard" role="group" aria-label="Simulated keyboard" hidden></div>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('history-preview');
  const open = root.querySelector('[data-open]');
  const back = root.querySelector('[data-back]');
  const title = root.querySelector('h2');
  const form = root.querySelector('form');
  const input = root.querySelector('input');
  const tabs = root.querySelector('nav');
  const keyboard = root.querySelector('.keyboard');
  const items = [...root.querySelectorAll('li')];
  const empty = root.querySelector('p');
  const count = root.querySelector('[data-count]');

  function filter() {
    const query = input.value.trim().toLowerCase();
    let visible = 0;
    for (const item of items) {
      item.hidden = !item.firstChild.textContent.toLowerCase().includes(query);
      if (!item.hidden) visible++;
    }
    empty.hidden = visible > 0;
    count.textContent = visible ? visible + ' matching conversations' : '';
  }

  function showSearch(active) {
    open.hidden = title.hidden = tabs.hidden = active;
    form.hidden = keyboard.hidden = !active;
    if (active) {
      input.focus();
    } else {
      input.value = '';
      filter();
      open.focus();
    }
  }

  for (const keys of ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', [' ', 'Backspace']]) {
    const row = document.createElement('div');
    row.className = 'key-row';
    for (const key of keys) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cursor-interaction';
      button.dataset.key = key;
      button.textContent = key === ' ' ? 'space' : key === 'Backspace' ? 'delete' : key;
      row.append(button);
    }
    keyboard.append(row);
  }

  keyboard.addEventListener('click', event => {
    const key = event.target.dataset.key;
    if (key === undefined) return;
    input.value = key === 'Backspace' ? input.value.slice(0, -1) : input.value + key;
    filter();
    input.focus();
  });
  open.addEventListener('click', () => showSearch(true));
  back.addEventListener('click', () => showSearch(false));
  input.addEventListener('input', filter);
  form.addEventListener('submit', event => event.preventDefault());
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !form.hidden) {
      event.preventDefault();
      showSearch(false);
    }
  });
})();
</script>
