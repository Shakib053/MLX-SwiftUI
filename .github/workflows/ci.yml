name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild build \
            -scheme MLX-SwiftUI \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -project MLX-SwiftUI.xcodeproj
