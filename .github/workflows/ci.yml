name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create temporary configuration
        run: |
          echo "HF_TOKEN = ci-placeholder" > Secrets.xcconfig

      - name: Show available schemes
        run: |
          xcodebuild \
            -project MLX-SwiftUI.xcodeproj \
            -list

      - name: Build MLX-SwiftUI
        run: |
          xcodebuild \
            -project MLX-SwiftUI.xcodeproj \
            -scheme MLX-SwiftUI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build
