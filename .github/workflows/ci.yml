name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift sources
        run: swiftlint lint --strict --no-cache

  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        destination: ['generic/platform=iOS Simulator', 'generic/platform=iOS']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create temporary configuration
        run: |
          echo "HF_TOKEN = ci-placeholder" > Secrets.xcconfig

      - name: Build MLX-SwiftUI
        run: |
          xcodebuild \
            -project MLX-SwiftUI.xcodeproj \
            -scheme MLX-SwiftUI \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
